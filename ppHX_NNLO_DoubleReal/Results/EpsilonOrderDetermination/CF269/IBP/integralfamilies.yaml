integralfamilies:
  - name: CF269
    loop_momenta: [ke, kf]
    top_level_sectors: [255]
    cut_propagators: [1, 2, 8]
    propagators:
      - ["kf", 0]
      - ["ke", 0]
      - ["-kb + kf", 0]
      - ["-ka + ke", 0]
      - ["-ka + ke + kf", 0]
      - ["-ka + kc + ke + kf", 0]
      - ["-ka - kb + kc + kf", 0]
      - ["ka + kb - kc - ke - kf", 0]
      - {bilinear: [["ka", "kf"], 0]}
